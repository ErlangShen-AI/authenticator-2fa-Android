name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build extension zips
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: npm run test

      - name: Package extensions
        run: npm run package

      - name: Upload extension zips
        uses: actions/upload-artifact@v7
        with:
          name: authenticator-2fa-zips
          path: artifacts/*.zip
          if-no-files-found: error
